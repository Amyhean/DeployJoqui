<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar actividades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f7f4;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 850px;
            margin: 50px auto;
        }

        .admin-card {
            background: white;
            border: none;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .admin-title {
            color: #245c3b;
            font-weight: 800;
        }

        .imagen-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-guardar {
            background: #2f7d4a;
            color: white;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
        }

        .btn-guardar:hover {
            background: #245f39;
            color: white;
        }

        .btn-agregar {
            border: 2px solid #2f7d4a;
            color: #2f7d4a;
            font-weight: 600;
        }

        .btn-agregar:hover {
            background: #2f7d4a;
            color: white;
        }

        #mensaje {
            display: none;
        }
    </style>
</head>

<body>
    <main class="container admin-container">
        <div class="admin-card">
            <h1 class="admin-title">Administrar actividades</h1>

            <p class="text-secondary">
                Registra una actividad para mostrarla en la página pública.
            </p>

            <form id="form-actividad">
                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Nombre de la actividad
                    </label>

                    <input type="text" id="titulo" class="form-control" maxlength="120" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">
                        Descripción
                    </label>

                    <textarea id="descripcion" class="form-control" rows="6" maxlength="1500" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="fechaActividad" class="form-label">
                        Fecha de la actividad
                    </label>

                    <input type="date" id="fechaActividad" class="form-control">
                </div>

                <div class="mb-4">
                    <label for="enlace" class="form-label">
                        Enlace para obtener más información
                    </label>

                    <input type="url" id="enlace" class="form-control" placeholder="https://...">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Fotografías de Google Drive
                    </label>

                    <p class="small text-secondary">
                        Puedes agregar hasta 10 enlaces. Las imágenes deben tener
                        acceso público.
                    </p>

                    <div id="contenedor-imagenes">
                        <div class="imagen-row">
                            <input type="url" class="form-control enlace-imagen"
                                placeholder="Enlace de la fotografía 1">
                        </div>
                    </div>

                    <button type="button" id="agregar-imagen" class="btn btn-agregar mt-2">
                        + Agregar otra fotografía
                    </button>

                    <div id="contador-imagenes" class="small text-secondary mt-2">
                        1 de 10 espacios
                    </div>
                </div>

                <div id="mensaje" class="alert mt-4"></div>

                <button type="submit" id="guardar" class="btn btn-guardar">
                    Guardar actividad
                </button>
            </form>
        </div>
    </main>

    <script>
        const URL_ACTIVIDADES =
            "https://script.google.com/macros/s/AKfycbwA78buT0P0orbLe7MH7QOLEoXov--uQEKpH9dPaiJ_l1AXeefBljv0BCidf0AUGDz3/exec";

        const formulario = document.getElementById("form-actividad");
        const contenedorImagenes =
            document.getElementById("contenedor-imagenes");
        const botonAgregar =
            document.getElementById("agregar-imagen");
        const botonGuardar =
            document.getElementById("guardar");
        const mensaje =
            document.getElementById("mensaje");
        const contador =
            document.getElementById("contador-imagenes");

        const MAXIMO_IMAGENES = 10;

        function actualizarContador() {
            const cantidad =
                document.querySelectorAll(".enlace-imagen").length;

            contador.textContent =
                `${cantidad} de ${MAXIMO_IMAGENES} espacios`;

            botonAgregar.disabled = cantidad >= MAXIMO_IMAGENES;
        }

        botonAgregar.addEventListener("click", () => {
            const cantidad =
                document.querySelectorAll(".enlace-imagen").length;

            if (cantidad >= MAXIMO_IMAGENES) return;

            const fila = document.createElement("div");
            fila.className = "imagen-row";

            fila.innerHTML = `
        <input
          type="url"
          class="form-control enlace-imagen"
          placeholder="Enlace de la fotografía ${cantidad + 1}"
        >

        <button
          type="button"
          class="btn btn-outline-danger quitar-imagen"
          aria-label="Eliminar enlace"
        >
          ✕
        </button>
      `;

            contenedorImagenes.appendChild(fila);
            actualizarContador();
        });

        contenedorImagenes.addEventListener("click", (evento) => {
            if (evento.target.classList.contains("quitar-imagen")) {
                evento.target.closest(".imagen-row").remove();
                actualizarContador();
            }
        });

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const imagenes = Array.from(
                document.querySelectorAll(".enlace-imagen")
            )
                .map(input => input.value.trim())
                .filter(Boolean);

            const actividad = {
                titulo: document.getElementById("titulo").value.trim(),
                descripcion:
                    document.getElementById("descripcion").value.trim(),
                fechaActividad:
                    document.getElementById("fechaActividad").value,
                enlace: document.getElementById("enlace").value.trim(),
                imagenes
            };

            botonGuardar.disabled = true;
            botonGuardar.textContent = "Guardando...";

            mostrarMensaje(
                "Guardando la actividad...",
                "alert-info"
            );

            try {
                const respuesta = await fetch(URL_ACTIVIDADES, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(actividad)
                });

                const resultado = await respuesta.json();

                if (!resultado.ok) {
                    throw new Error(
                        resultado.mensaje || "No se pudo guardar la actividad."
                    );
                }

                mostrarMensaje(
                    "✅ La actividad se guardó correctamente.",
                    "alert-success"
                );

                formulario.reset();

                contenedorImagenes.innerHTML = `
          <div class="imagen-row">
            <input
              type="url"
              class="form-control enlace-imagen"
              placeholder="Enlace de la fotografía 1"
            >
          </div>
        `;

                actualizarContador();

            } catch (error) {
                console.error(error);

                mostrarMensaje(
                    "❌ No se pudo guardar: " + error.message,
                    "alert-danger"
                );
            } finally {
                botonGuardar.disabled = false;
                botonGuardar.textContent = "Guardar actividad";
            }
        });

        function mostrarMensaje(texto, clase) {
            mensaje.style.display = "block";
            mensaje.className = `alert mt-4 ${clase}`;
            mensaje.textContent = texto;
        }

        actualizarContador();
    </script>
</body>

</html>
