<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./SRC/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/cards.css">
    <link rel="stylesheet" href="./CSS/whats.css">
    <link rel="stylesheet" href="./CSS/actr.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Actividades Proximas</title>
</head>

<body>
    <!--Navbar-->
    <header id="navbar"></header>

    <div class="container">
        <div class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col-md-12">
                <div class="card mb-3" style="border: none;">
                <section id="actividades" class="container my-5">
                    <h2 class="text-center mb-4 fw-bold" style="color:#2d2d2d;">
                        🌟 Entérate de lo último | Próximas actividades y novedades 🌿
                    </h2>
                
                    <div id="lista-actividades" class="row row-cols-1 row-cols-md-3 g-4 justify-content-center text-center">
                        <p>Cargando publicaciones...</p>
                    </div>
                </section>
                
                
                <script>
                    const URL_ACTIVIDADES =
                        "https://script.google.com/macros/s/AKfycbwA78buT0P0orbLe7MH7QOLEoXov--uQEKpH9dPaiJ_l1AXeefBljv0BCidf0AUGDz3/exec";

                    function formatearFecha(fecha) {
                        if (!fecha) return "Fecha por confirmar";

                        const fechaLocal = new Date(fecha + "T12:00:00");

                        return fechaLocal.toLocaleDateString("es-MX", {
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        });
                    }

                    function escaparHtml(texto) {
                        const elemento = document.createElement("div");
                        elemento.textContent = texto || "";
                        return elemento.innerHTML;
                    }

                    function obtenerIdDrive(enlace) {
                        if (!enlace) return "";

                        const formatos = [
                            /\/file\/d\/([a-zA-Z0-9_-]+)/,
                            /[?&]id=([a-zA-Z0-9_-]+)/,
                            /\/d\/([a-zA-Z0-9_-]+)/
                        ];

                        for (const formato of formatos) {
                            const resultado = enlace.match(formato);

                            if (resultado) {
                                return resultado[1];
                            }
                        }

                        return "";
                    }

                    function prepararImagen(enlace) {
                        if (!enlace) return "";

                        const idDrive = obtenerIdDrive(enlace);

                        if (idDrive) {
                            return `https://drive.google.com/thumbnail?id=${idDrive}&sz=w1200`;
                        }

                        return enlace;
                    }

                    function crearGaleria(imagenes, indiceActividad) {
                        if (!imagenes || imagenes.length === 0) {
                            return `
                        <div class="card-img-top d-flex align-items-center
                                    justify-content-center">
                          Sin imagen
                        </div>
                      `;
                        }

                        if (imagenes.length === 1) {
                            const imagen = prepararImagen(imagenes[0]);

                            return `
                        <img
                          src="${imagen}"
                          class="card-img-top"
                          alt="Fotografía de la actividad"
                          loading="lazy"
                        >
                      `;
                        }

                        const idCarrusel = `galeria-${indiceActividad}`;

                        const indicadores = imagenes.map((imagen, indice) => `
                      <button
                        type="button"
                        data-bs-target="#${idCarrusel}"
                        data-bs-slide-to="${indice}"
                        class="${indice === 0 ? "active" : ""}"
                        aria-label="Fotografía ${indice + 1}">
                      </button>
                    `).join("");

                        const fotografias = imagenes.map((enlace, indice) => `
                      <div class="carousel-item ${indice === 0 ? "active" : ""}">
                        <img
                          src="${prepararImagen(enlace)}"
                          class="d-block w-100 card-img-top"
                          alt="Fotografía ${indice + 1} de la actividad"
                          loading="lazy"
                        >
                      </div>
                    `).join("");

                        return `
                      <div
                        id="${idCarrusel}"
                        class="carousel slide"
                        data-bs-ride="false"
                      >
                        <div class="carousel-indicators">
                          ${indicadores}
                        </div>
                
                        <div class="carousel-inner">
                          ${fotografias}
                        </div>
                
                        <button
                          class="carousel-control-prev"
                          type="button"
                          data-bs-target="#${idCarrusel}"
                          data-bs-slide="prev"
                        >
                          <span class="carousel-control-prev-icon"></span>
                          <span class="visually-hidden">Anterior</span>
                        </button>
                
                        <button
                          class="carousel-control-next"
                          type="button"
                          data-bs-target="#${idCarrusel}"
                          data-bs-slide="next"
                        >
                          <span class="carousel-control-next-icon"></span>
                          <span class="visually-hidden">Siguiente</span>
                        </button>
                      </div>
                    `;
                    }

                    async function cargarActividades() {
                        const contenedor =
                            document.getElementById("lista-actividades");

                        try {
                            const respuesta = await fetch(
                                URL_ACTIVIDADES + "?t=" + Date.now()
                            );

                            if (!respuesta.ok) {
                                throw new Error("No se pudieron obtener las actividades.");
                            }

                            const resultado = await respuesta.json();

                            if (!resultado.ok) {
                                throw new Error(
                                    resultado.mensaje || "Respuesta incorrecta del servidor."
                                );
                            }

                            const actividades = Array.isArray(resultado.data)
                                ? resultado.data
                                : [];

                            if (actividades.length === 0) {
                                contenedor.innerHTML = `
                          <div class="col-12">
                            <p class="facebook-empty">
                              No hay actividades disponibles en este momento.
                            </p>
                          </div>
                        `;
                                return;
                            }

                            contenedor.innerHTML = actividades.map(
                                (actividad, indice) => {
                                    const titulo = escaparHtml(
                                        actividad.titulo || "Actividad"
                                    );

                                    const descripcion = escaparHtml(
                                        actividad.descripcion || "Sin descripción."
                                    );

                                    const enlaceSeguro = escaparHtml(
                                        actividad.enlace || ""
                                    );

                                    const boton = enlaceSeguro
                                        ? `
                              <a
                                href="${enlaceSeguro}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn-facebook"
                              >
                                Ver más
                              </a>
                            `
                                        : "";

                                    return `
                            <div class="col">
                              <article class="card">
                                ${crearGaleria(actividad.imagenes, indice)}
                
                                <div class="card-body">
                                  <h3 class="card-title">${titulo}</h3>
                
                                  <p class="card-text">
                                    ${descripcion}
                                  </p>
                
                                  ${boton}
                                </div>
                
                                <div class="card-footer">
                                  📅 ${formatearFecha(
                                        actividad.fechaActividad
                                    )}
                                </div>
                              </article>
                            </div>
                          `;
                                }
                            ).join("");

                        } catch (error) {
                            console.error(error);

                            contenedor.innerHTML = `
                        <div class="col-12">
                          <p class="facebook-error">
                            No se pudieron cargar las actividades.
                          </p>
                        </div>
                      `;
                        }
                    }

                    cargarActividades();
                </script>



                </div>
            </div>
        </div>
    </div>



    <div class="right">
        <img class="btn-whatsapp" src="https://clientes.dongee.com/whatsapp.png" width="64" height="64" alt="Whatsapp"
            onclick="window.location.href='https://wa.me/+525524105619?text=Hola!%20Estoy%20interesado%20en%20asistir%20al%20parque'" />
    </div>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <script src="./JS/main.js"></script>
    <script src="./JS/footer.js"></script>
</body>

</html>
